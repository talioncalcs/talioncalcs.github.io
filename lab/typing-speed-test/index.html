<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Typing Speed Test – Free 60 Second WPM Calculator | Talion Labs</title>
  <meta name="description" content="Free online typing speed test to measure your words per minute (WPM) and accuracy. Take the 60 second typing test and improve your speed.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <p class="lab-label">Talion Labs</p>
    <h1>Typing Speed Test</h1>
    <p class="description">Measure your typing speed with our free 60-second WPM calculator.</p>

    <div class="test-box">
      <div class="timer">60</div>
      <div id="text-display" class="text-display"></div>
      <textarea id="input-area" placeholder="Start typing here..." disabled></textarea>
      <button id="start-btn">Start Test</button>
    </div>

    <div id="result-box" class="result-box hidden">
      <h2>Your Results</h2>
      <p>WPM: <span id="wpm"></span></p>
      <p>Accuracy: <span id="accuracy"></span>%</p>
      <button onclick="location.reload()">Restart</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
